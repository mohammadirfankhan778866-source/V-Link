# Codemagic CI/CD Build Configuration for V-Link (Pulse Chat)
# Connect your GitHub repository to codemagic.io to generate APKs or AABs automatically!

workflows:
  android-build:
    name: V-Link Android Build (APK & AAB)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_sdk: 34
      ndk: 26.1.10909125
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Initialize Gradle configuration properties
        script: |
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
      - name: Check Java and Gradle version
        script: |
          java --version
          ./gradlew --version
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
      - name: Build Android Release App Bundle (AAB)
        script: |
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - mohammadirfankhan778866@gmail.com
        notify:
          success: true
          failure: true
